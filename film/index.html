<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sec Ops</title>
<style>
  :root { --ink: #050607; --bone: #ece6d6; --green: #27ff8a; --red: #ff2b1c; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Share Tech Mono", ui-monospace, monospace; color: var(--bone); }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  #out { width: 100%; height: 100%; display: block; background: #000; }
  #gate { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
          background: radial-gradient(circle, rgba(5,6,7,.35), rgba(5,6,7,.85)); transition: opacity .25s; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gate div { text-align: center; letter-spacing: .3em; }
  #gate b { display: block; font-size: clamp(18px, 3vw, 40px); color: var(--green); margin-bottom: .6em; }
  #gate small { opacity: .6; font-size: clamp(10px, 1.2vw, 14px); }
  #track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(236,230,214,.08); }
  #bar { height: 100%; width: 0; background: var(--red); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="out"></canvas>
    <div id="gate"><div><b>LOADING…</b><small>HEADPHONES ON · SPACE PAUSE · ← → SEEK · F FULLSCREEN</small></div></div>
    <div id="track"><div id="bar"></div></div>
  </div>
  <audio id="score" src="audio/score.mp3" preload="auto"></audio>
  <script src="js/core.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
